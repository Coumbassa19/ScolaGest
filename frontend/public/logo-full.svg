<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" role="img" aria-label="ScolaGest">
  <!-- Card background, in the app's own cream background tone (color-background) -->
  <rect x="16" y="16" width="448" height="488" rx="48" fill="#f4f3ef" />

  <!-- Mortarboard mark -->
  <g transform="translate(140,54) scale(2)">
    <polygon points="50,8 92,38 50,60 8,38" fill="#c9a84c" />
    <rect x="29" y="40" width="42" height="26" rx="9" fill="#1a3a5c" />
    <circle cx="50" cy="37" r="4.5" fill="#1a3a5c" />
    <path
      d="M50,37 C59,45 63,58 65,71"
      fill="none"
      stroke="#1a3a5c"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <path
      d="M59,77 L65,71 L71,78"
      fill="none"
      stroke="#1a3a5c"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark -->
  <text
    x="240"
    y="332"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="54"
    fill="#1a3a5c"
  >ScolaGest</text>

  <!-- Tagline -->
  <text
    x="240"
    y="368"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="500"
    font-size="17"
    letter-spacing="2"
    fill="#5b6b7a"
  >La gestion scolaire, simplifiée.</text>
</svg>
